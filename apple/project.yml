name: LinguaVerve
options:
  bundleIdPrefix: com.linguaverve
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

packages:
  LinguaVerveKit:
    path: ../macos

targets:
  LinguaVerve:
    type: application
    supportedDestinations:
      - iOS
      - macOS
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: LinguaVerveKit
        product: LinguaVerveCore
      - package: LinguaVerveKit
        product: LinguaVerveUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linguaverve.app
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LinguaVerve
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "LinguaVerve uses the microphone for live Speaking Exam simulations and AI Speaking Roleplay coaching."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "LinguaVerve transcribes your spoken English and German responses for CEFR Speaking evaluation."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    info:
      path: Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
